# seed/data/incidents.yaml
# Incidents and their journal entries, per store. Times are offsets from the
# anchor (the seed run time). eta_local is a firm ETA at that store-local time:
# today, or tomorrow if that time has already passed when the seed runs.
#
# Store 01234 (Chennai) is the mobile app mock data: INC00001234 to INC00001237,
# field for field. Every incident opens a few minutes after its network or
# device fault in event_scenarios.yaml / store_overrides.yaml.
#
# All journal entries are seeded "pending" for the worker (Phase 9). Each
# incident also gets a system "Incident created" entry at opened_at, and a
# resolved incident gets its close notes as a work note at resolved_at; both
# are added by the seed code, not listed here.
#
# Numbers must stay below INC00002000 (new incidents use a sequence from 2000).

incidents:
