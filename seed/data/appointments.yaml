# tagged to an ACTIVE incident of the same store and matches its story.
#
# day + at_local is a store-local time: "today" at that time, or the next day if
# that time has already passed when the seed runs (so the screen is never empty).
#
# Store 01234 (Chennai): apt-001 to apt-003 of the mobile mock data. apt-004 and
# apt-005 are not seeded because they have no incident.

